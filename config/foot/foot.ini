[main]
# --- 关键修复：允许加粗文本使用明亮色调 ---
bold-text-in-bright=yes
dpi-aware=no
term=xterm-256color
font=Cascadia Mono:size=12, Sarasa Term SC:size=12, Liberation Mono:size=12

[csd]
# 继承原始无边框设置
preferred=none
size=0
border-width=0

[colors-dark]
# --- 核心背景：保持 24443a ---
background=24443a
# 前景色：亮乳白色
foreground=f0f0e0

# 闪烁与高亮
flash=3a5c4d
flash-alpha=0.5

# 光标 (文本色 光标色)
cursor=24443a ffffff

# 选择区域
selection-foreground=ffffff
selection-background=4a6c5d

# --- ANSI 调色盘 ---
regular0=0d1a16
# 标准粉笔红
regular1=ff5555
regular2=98c379
# 目录色 (标准天蓝)
regular3=89caed
# Claude 陶土色 (字符设备使用 0;34)
regular4=d97757
# 链接颜色：玫瑰红 (ln=0;35)
regular5=ff4b82
# 标准黄色 (块设备使用 0;36)
regular6=e5c07b
regular7=abb2bf

# 明亮色 (Bright Colors)
bright0=5c6370
# 主机名颜色 (1;31)
bright1=ff6666
bright2=b5e8b0
# 目录高亮 (1;33)
bright3=b3e4f3
# Claude 亮桃色 (字符设备高亮 1;34)
bright4=ff8e5e
# 用户名颜色：深紫色 (PS1 的 1;35 现在会正确映射到这里)
bright5=8a2be2
# 块设备高亮 (1;36)
bright6=f1fa8c
bright7=ffffff

[cursor]
style=block
blink=yes
beam-thickness=1.5

[scrollback]
indicator-format=percentage
indicator-position=fixed
